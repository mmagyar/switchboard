[package]
name = "switchboard"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Typed Rust HTTP routing with validation, permissions, streaming and optional Maud templates"
license = "MIT"

[features]
default = ["server", "client"]
server = ["tokio/full", "dep:hyper", "dep:hyper-util", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:rcgen", "dep:tokio-tungstenite", "dep:notify", "dep:tracing"]
client = ["dep:reqwest"]
maud = ["dep:maud"]

[dependencies]
axum = { version = "0.8", default-features = false }
bytes = "1"
http = "1"
http-body-util = "0.1"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
url = "2"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
schemars = "1"
multer = "3"
hyper = { version = "1", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
rcgen = { version = "0.14", features = ["pem"], optional = true }
tokio-tungstenite = { version = "0.28", optional = true }
notify = { version = "8", optional = true }
tracing = { version = "0.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"], optional = true }
maud = { version = "0.27", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
