[package]
name = "switchboard-browser-demo"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "browser-demo-server"
path = "src/server.rs"
required-features = ["server"]

[features]
server = ["switchboard/server", "switchboard/maud", "dep:tokio", "dep:maud"]

[dependencies]
switchboard = { path = "../../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
maud = { version = "0.27", optional = true }
tokio = { version = "1", features = ["macros", "rt", "signal", "sync"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
switchboard-browser = { path = "../.." }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Window", "EventTarget", "WebSocket"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "debuginfo"
