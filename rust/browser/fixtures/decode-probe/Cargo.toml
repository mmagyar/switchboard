[package]
name = "switchboard-browser-decode-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
switchboard = { path = "../../..", default-features = false }
switchboard-browser = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "debuginfo"
